<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pawsocks</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    background: #0b0b0c;
    color: #eaeaea;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }

  #status {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.95rem;
    letter-spacing: 0.02em;
    color: #999;
    text-align: center;
    padding: 1.5rem;
  }

  /* Gallery: a justified mosaic. Rows are scaled to exactly fill the
     container width; a partial last row is centered, never stretched. */
  #gallery {
    width: 100%;
    line-height: 0; /* kill inline-element whitespace gaps */
  }

  #gallery .row {
    display: flex;
    width: 100%;
    animation: galleryFade 0.5s ease both;
  }

  #gallery .row.last {
    justify-content: center;
  }

  #gallery a {
    display: block;
    line-height: 0;
    flex-shrink: 0;
  }

  #gallery img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  @keyframes galleryFade {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
<div id="status">Loading gallery…</div>
<div id="gallery"></div>

<script>
(function () {
  const OWNER = "pawsockspics";
  const REPO = "pawsocks";
  const BRANCH = "main";

  // Known image files in the repo, used if the live GitHub API listing
  // (rate-limited / CORS-sensitive) can't be reached.
  const FALLBACK_FILES = [
    "pawsocks (1).jpeg", "pawsocks (2).jpeg", "pawsocks (3).jpeg", "pawsocks (4).jpeg",
    "pawsocks (5).jpeg", "pawsocks (6).jpeg", "pawsocks (7).jpeg", "pawsocks (8).jpeg",
    "pawsocks (9).jpeg", "pawsocks (10).jpeg", "pawsocks (11).jpeg", "pawsocks (12).jpeg"
  ];

  function rawUrl(name) {
    return `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/${encodeURIComponent(name)}`;
  }

  async function getImageFileNames() {
    try {
      const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/`);
      if (!res.ok) throw new Error(`GitHub API responded ${res.status}`);
      const data = await res.json();
      const names = data
        .filter(item => item.type === "file" && /\.(jpe?g|png)$/i.test(item.name))
        .map(item => item.name);
      if (names.length) return names;
      throw new Error("No jpeg/png files found via API");
    } catch (err) {
      console.warn("Falling back to static file list:", err);
      return FALLBACK_FILES;
    }
  }

  function loadImage(src) {
    return new Promise(resolve => {
      const img = new Image();
      img.onload = () => resolve({ src, w: img.naturalWidth, h: img.naturalHeight });
      img.onerror = () => resolve(null);
      img.src = src;
    });
  }

  // Flickr-style justified mosaic. Images are greedily packed into rows at
  // a height found by binary search so the whole gallery fills the viewport
  // edge to edge: every full row is scaled to exactly the container width,
  // and the partial last row is centered instead of being stretched huge.
  function layoutGallery(items) {
    const gallery = document.getElementById("gallery");
    gallery.innerHTML = "";

    const containerWidth = gallery.clientWidth || window.innerWidth;
    const viewportHeight = window.innerHeight;
    if (containerWidth <= 0 || items.length === 0) return;

    // Greedily pack items into rows at a given row height.
    function pack(h) {
      const rows = [];
      let cur = [];
      let sum = 0;
      for (const item of items) {
        cur.push(item);
        sum += item.aspect;
        if (sum * h >= containerWidth) {
          rows.push(cur);
          cur = [];
          sum = 0;
        }
      }
      if (cur.length) rows.push(cur);
      return rows;
    }

    // Total height of the mosaic: full rows justified to the container
    // width, the last row kept at the packing height.
    function totalHeight(rows, h) {
      return rows.reduce((total, row, i) => {
        const rowAspect = row.reduce((s, it) => s + it.aspect, 0);
        const rh = (i === rows.length - 1) ? h : containerWidth / rowAspect;
        return total + rh;
      }, 0);
    }

    // Binary search: pick the packing height so the mosaic fills the
    // viewport height (it always fills the full width row by row).
    let lo = 60;
    let hi = 800;
    for (let i = 0; i < 24; i++) {
      const mid = (lo + hi) / 2;
      if (totalHeight(pack(mid), mid) < viewportHeight) lo = mid;
      else hi = mid;
    }
    const rows = pack(hi);

    rows.forEach((row, i) => {
      const isLast = i === rows.length - 1;
      const rowAspect = row.reduce((s, it) => s + it.aspect, 0);
      let rh = isLast ? hi : containerWidth / rowAspect;
      if (isLast) {
        // Never let the centered last row overflow the container.
        const maxAspect = Math.max.apply(null, row.map(it => it.aspect));
        rh = Math.min(rh, containerWidth / maxAspect);
      }
      rh = Math.max(24, rh);

      const rowEl = document.createElement("div");
      rowEl.className = isLast ? "row last" : "row";
      row.forEach(item => {
        const width = item.aspect * rh;
        const link = document.createElement("a");
        link.href = item.src;
        link.target = "_blank";
        link.rel = "noopener";
        link.style.width = width + "px";
        link.style.height = rh + "px";

        const imgEl = document.createElement("img");
        imgEl.src = item.src;
        imgEl.alt = "Pawsocks photo";
        imgEl.loading = "lazy";

        link.appendChild(imgEl);
        rowEl.appendChild(link);
      });
      gallery.appendChild(rowEl);
    });
  }

  async function init() {
    const status = document.getElementById("status");
    const fileNames = await getImageFileNames();
    status.textContent = `Loading ${fileNames.length} images…`;

    const results = await Promise.all(fileNames.map(name => loadImage(rawUrl(name))));
    const loaded = results.filter(Boolean);

    if (loaded.length === 0) {
      status.textContent = "Couldn't load any images from the repository.";
      return;
    }

    status.remove();

    const items = loaded.map(item => ({ src: item.src, aspect: item.w / item.h }));
    layoutGallery(items);

    let resizeTimer;
    const relayout = () => layoutGallery(items);
    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(relayout, 100);
    });
    window.addEventListener("orientationchange", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(relayout, 250);
    });
  }

  init();
})();
</script>
</body>
</html>
