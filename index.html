<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pawsocks</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    min-height: 100%;
    background: #0b0b0c;
    color: #eaeaea;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }

  body { zoom: 1.25; }

  #status {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.95rem;
    letter-spacing: 0.02em;
    color: #999;
    text-align: center;
    padding: 1.5rem;
    z-index: 10;
    background: #0b0b0c;
  }

  #gallery {
    width: 100%;
    line-height: 0;
    padding-bottom: 80px;
  }

  #gallery .row {
    display: flex;
    width: 100%;
    overflow: hidden;
  }

  #gallery .row.new {
    animation: galleryFade 0.35s ease both;
  }

  #gallery a {
    display: block;
    line-height: 0;
    flex-shrink: 0;
    overflow: hidden;
  }

  #gallery img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  #loader {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.78rem;
    color: #666;
    letter-spacing: 0.03em;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s;
    z-index: 5;
  }
  #loader.visible { opacity: 1; }

  @keyframes galleryFade {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
<div id="status">loading</div>
<div id="gallery"></div>
<div id="loader">loading more…</div>

<script>
(function () {
  const QUERIES = [
    "egirl cat paws socks",
    "egirl female pawsocks cat socks"
  ];

  // Exact URL blacklist
  const BLACKLIST = new Set([
    "https://i.pinimg.com/originals/26/73/7b/26737b0531866e79e1a48fab0f5e6c73.jpg"
  ]);

  const BATCH_SIZE = 10;
  const FETCH_INTERVAL = 500;

  const TARGET_ROW_H = () => Math.max(160, Math.min(260, Math.round(window.innerHeight * 0.26)));

  let pool = [];
  let rendered = 0;
  let queryIndex = 0;
  let seen = new Set();
  let loading = false;
  let rowH = TARGET_ROW_H();

  const statusEl = document.getElementById("status");
  const galleryEl = document.getElementById("gallery");
  const loaderEl = document.getElementById("loader");

  function pinId(url) {
    try {
      const m = url.match(/\/([0-9a-f]{16,})\./i) ||
                url.match(/\/([0-9a-f]{8}\/[0-9a-f]{8}\/[0-9a-f]{8}\/[0-9a-f]{8,})/i);
      if (m) return m[1].replace(/\//g, "");
      const parts = url.split("/");
      return parts[parts.length - 1].split("?")[0].split(".")[0];
    } catch {
      return url;
    }
  }

  // Also blacklist by id so size variants are caught
  BLACKLIST.forEach(u => seen.add(pinId(u)));

  async function searchPinterest(query) {
    const url = `https://prexzyapis.com/search/pinterest?q=${encodeURIComponent(query)}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();
    if (!json.status || !Array.isArray(json.data)) return [];
    return json.data.filter(u => typeof u === "string" && /i\.pinimg\.com/i.test(u));
  }

  function loadImage(src) {
    return new Promise(resolve => {
      const img = new Image();
      img.onload = () => {
        if (img.naturalWidth < 80 || img.naturalHeight < 80) {
          resolve(null);
          return;
        }
        resolve({ src, w: img.naturalWidth, h: img.naturalHeight });
      };
      img.onerror = () => resolve(null);
      img.src = src;
    });
  }

  async function fetchBatch() {
    const fresh = [];
    const tries = Math.min(6, QUERIES.length);
    for (let i = 0; i < tries && fresh.length < BATCH_SIZE; i++) {
      const q = QUERIES[queryIndex % QUERIES.length];
      queryIndex++;
      try {
        const urls = await searchPinterest(q);
        for (const u of urls) {
          if (BLACKLIST.has(u)) continue;
          const id = pinId(u);
          if (seen.has(id)) continue;
          seen.add(id);
          fresh.push(u);
          if (fresh.length >= BATCH_SIZE) break;
        }
      } catch (e) {
        console.warn("query failed", q, e);
      }
    }
    return fresh;
  }

  async function loadAndAdd(urls) {
    if (!urls.length) return 0;
    const results = await Promise.all(urls.map(loadImage));
    let added = 0;
    for (const r of results) {
      if (!r) continue;
      if (BLACKLIST.has(r.src)) continue;
      const id = pinId(r.src);
      if (pool.some(p => p.id === id)) continue;
      pool.push({ src: r.src, aspect: r.w / r.h, id });
      added++;
    }
    return added;
  }

  function appendRows(fromIndex, maxImages) {
    const available = pool.slice(fromIndex, fromIndex + maxImages);
    if (!available.length) return 0;

    const containerWidth = galleryEl.clientWidth || window.innerWidth;
    if (containerWidth <= 0) return 0;

    const rows = [];
    let cur = [];
    let sumAspect = 0;
    let used = 0;

    for (const item of available) {
      cur.push(item);
      sumAspect += item.aspect;
      used++;
      if (sumAspect * rowH >= containerWidth * 0.98) {
        rows.push({ items: cur, aspectSum: sumAspect });
        cur = [];
        sumAspect = 0;
      }
    }

    rows.forEach(row => {
      const rh = containerWidth / row.aspectSum;
      const rowEl = document.createElement("div");
      rowEl.className = "row new";

      row.items.forEach(item => {
        const w = item.aspect * rh;
        const link = document.createElement("a");
        link.href = item.src;
        link.target = "_blank";
        link.rel = "noopener";
        link.style.width = Math.floor(w) + "px";
        link.style.height = Math.floor(rh) + "px";

        const img = document.createElement("img");
        img.src = item.src;
        img.alt = "egirl female in pawsocks";
        img.loading = "lazy";
        img.decoding = "async";

        link.appendChild(img);
        rowEl.appendChild(link);
      });

      const links = rowEl.querySelectorAll("a");
      if (links.length) {
        let total = 0;
        links.forEach(a => total += parseInt(a.style.width, 10));
        const diff = containerWidth - total;
        if (diff !== 0) {
          const last = links[links.length - 1];
          last.style.width = (parseInt(last.style.width, 10) + diff) + "px";
        }
      }

      galleryEl.appendChild(rowEl);
    });

    return used - cur.length;
  }

  function revealAvailable() {
    if (rendered >= pool.length) return 0;
    const added = appendRows(rendered, pool.length - rendered);
    rendered += added;
    return added;
  }

  async function cycle() {
    if (loading) return;
    loading = true;
    loaderEl.classList.add("visible");
    try {
      const urls = await fetchBatch();
      if (urls.length) {
        await loadAndAdd(urls);
        revealAvailable();
      }
    } finally {
      loading = false;
      loaderEl.classList.remove("visible");
    }
  }

  function fullRelayout() {
    rowH = TARGET_ROW_H();
    galleryEl.innerHTML = "";
    const prev = rendered;
    rendered = 0;
    while (rendered < prev) {
      const n = appendRows(rendered, 30);
      if (!n) break;
      rendered += n;
    }
  }

  async function init() {
    statusEl.textContent = "loading";
    rowH = TARGET_ROW_H();

    for (let i = 0; i < 3; i++) {
      await cycle();
    }
    statusEl.remove();

    setInterval(cycle, FETCH_INTERVAL);

    window.addEventListener("resize", () => {
      clearTimeout(window.__rt);
      window.__rt = setTimeout(fullRelayout, 120);
    });
  }

  init();
})();
</script>
</body>
</html>
