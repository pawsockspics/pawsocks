<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pawsocks</title>
<link rel="preconnect" href="https://i.pinimg.com" crossorigin>
<link rel="preconnect" href="https://proxy.cors.sh">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { width: 100%; height: 100%; -webkit-text-size-adjust: 100%; }
  body {
    width: 100%; min-height: 100%; background: #0b0b0c; color: #eaeaea;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    overflow-x: hidden; overflow-y: auto; -webkit-overflow-scrolling: touch;
  }
  @media (min-width: 768px) { body { zoom: 1.25; } }
  #status {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 0.95rem; letter-spacing: 0.02em; color: #999; text-align: center;
    padding: 1.5rem; z-index: 10; background: #0b0b0c;
  }
  #gallery { width: 100%; line-height: 0; padding-bottom: 80px; }
  #gallery .row { display: flex; width: 100%; overflow: hidden; }
  #gallery .row.new { animation: galleryFade 0.35s ease both; }
  #gallery a {
    display: block; line-height: 0; flex-shrink: 0; overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  #gallery img { display: block; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
  #loader {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    font-size: 0.78rem; color: #666; letter-spacing: 0.03em; pointer-events: none;
    opacity: 0; transition: opacity 0.2s; z-index: 5;
  }
  #loader.visible { opacity: 1; }
  @keyframes galleryFade {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
<div id="status">loading</div>
<div id="gallery"></div>
<div id="loader">loading more…</div>

<script>
(function () {
  const QUERIES = [
    "egirl cat paws socks pics",
    "egirl female in pawsocks (cat socks)",
    "egirl cute pawsocks pics",
    "egirl neko catsocks pawsocks",
    "egirl catgirl paw socks",
    "pawsocks discord @",
    "paws egirl",
    "egirl stockings with pawsocks",
    "egirl white pawsocks pics"
  ];

  const BLACKLIST = new Set([
    "https://i.pinimg.com/originals/26/73/7b/26737b0531866e79e1a48fab0f5e6c73.jpg"
  ]);

  const BATCH_SIZE    = 10;
  const FETCH_INTERVAL = 1500;
  const FETCH_TIMEOUT  = 15000;
  const MAX_ATTEMPTS_PER_QUERY = 4;  // how many combos to try per query per batch call

  // ─────────────────────────────────────────────────────────────────────────────
  // pinterest_dl (Python) ported to JavaScript.
  // Ported from "pinterest downloader/pinterest_dl/":
  //   download/request_builder.py   → buildGet()/urlEncode()
  //   api/endpoints.py              → ENDPOINT_SEARCH
  //   api/api.py (get_search)       → searchOptions()
  //   api/bookmark_manager.py       → BookmarkManager
  //   api/pinterest_response.py     → validateResponse()
  //   parsers/response.py           → parseResults()
  //   scrapers/api_scraper.py       → pinterestSearch() (iter_search/_pump/_collect)
  // The original Python used `requests`, which has no CORS enforcement, so it
  // talked to Pinterest directly. Browsers enforce CORS, so the fetch goes
  // through the relay chain below — the scraping logic itself is identical.
  // ─────────────────────────────────────────────────────────────────────────────

  const ENDPOINT_SEARCH = "https://www.pinterest.com/resource/BaseSearchResource/get/";
  const PWS_HANDLER     = "www/pin/[id].js";  // required by Pinterest since 2025-03-07

  // request_builder.py url_encode():
  //   Python quote_plus escapes !'()* and encodes spaces as %20; JS
  //   encodeURIComponent leaves !'()* alone, so escape them manually.
  function urlEncode(str) {
    return encodeURIComponent(str)
      .replace(/[!'()*]/g, c => "%" + c.charCodeAt(0).toString(16).toUpperCase())
      .replace(/\+/g, "%20");
  }

  // request_builder.py build_get():
  //   endpoint?source_url=..&data=JSON.stringify({options, context})&_=ms
  function buildGet(endpoint, options, sourceUrl) {
    const data = JSON.stringify({ options: options, context: {} });
    return endpoint + "?" +
      "source_url=" + urlEncode(sourceUrl) +
      "&data=" + urlEncode(data) +
      "&_=" + Date.now();
  }

  // api/bookmark_manager.py
  class BookmarkManager {
    constructor(last) { this.bookmarks = []; this.last = last; }
    addAll(list) { this.bookmarks.push(...list); }
    get() { return this.bookmarks.length < this.last ? this.bookmarks : this.bookmarks.slice(-this.last); }
  }

  // api/pinterest_response.py — validate + extract bookmarks
  function validateResponse(json) {
    const rr = json && json.resource_response;
    if (!rr) throw new Error("Invalid response: 'resource_response' key not found.");
    if (rr.error) throw new Error(rr.error.message || "Unknown Pinterest error");
    if (!json.resource) throw new Error("Invalid response: 'resource' key not found.");
    if (rr.data === undefined || rr.data === null) throw new Error("Invalid response: 'data' key not found.");
    const bookmarks = (json.resource.options && json.resource.options.bookmarks) || [];
    return { data: rr.data, bookmarks: bookmarks };
  }

  // parsers/response.py from_responses() — keep pins with a usable image.
  // Display-only: prefer the 736x variant (≈100-400 KB) over the full
  // resolution "orig" (1-3 MB) so the gallery loads fast.
  const PREFERRED_SIZES = ["736x", "474x", "236x", "orig"];
  function parseResults(results) {
    const out = [];
    for (const item of results) {
      if (!item || typeof item !== "object") continue;
      const images = item.images;
      if (!images) continue;
      let best = null;
      for (const size of PREFERRED_SIZES) {
        const v = images[size];
        if (v && v.url) { best = v; break; }
      }
      if (!best) continue;
      const width  = parseInt(best.width, 10);
      const height = parseInt(best.height, 10);
      if (isNaN(width) || isNaN(height)) continue;
      out.push({ id: item.id, src: best.url, width: width, height: height });
    }
    return out;
  }

  // api/api.py get_search() options dict
  function searchOptions(query, bookmarks) {
    return {
      appliedProductFilters: "---",
      auto_correction_disabled: false,
      bookmarks: bookmarks,
      page_size: 50,                 // pinterest API maxes out at 50 per request
      query: query,
      redux_normalize_feed: true,
      rs: "typed",
      scope: "pins",
      source_url: "/search/pins/?q=" + query + "rs=typed"
    };
  }

  // ── Transport ────────────────────────────────────────────────────────────────
  // The Python downloader used requests.Session with a User-Agent and the
  // x-pinterest-pws-handler header. Pinterest requires that header (403 without
  // it) but sends no Access-Control-Allow-Origin, so a page can't read the
  // response directly. We send the header through cors-anywhere-style relays
  // that answer CORS preflights AND forward custom headers to Pinterest.
  const RELAYS = [
    (url) => "https://proxy.cors.sh/" + url,
    (url) => "https://cors.eu.org/" + url,
    (url) => "https://api.cors.lol/?url=" + encodeURIComponent(url),
    (url) => "https://test.cors.workers.dev/" + url,
    (url) => "https://cors-anywhere.com/" + url
  ];

  let workingRelayIndex = 0;  // relay that worked last — tried first
  let workingFails = 0;       // consecutive failures of the working relay

  async function fetchPinterestJson(url) {
    const overall = new AbortController();
    const otid = setTimeout(() => overall.abort(), FETCH_TIMEOUT);
    try {
      const headers = { "x-pinterest-pws-handler": PWS_HANDLER };
      let lastErr = null;

      // Order: last-known-good relay first, then the rest in order
      const order = [...Array(RELAYS.length).keys()]
        .map(i => (i + workingRelayIndex) % RELAYS.length);

      for (const idx of order) {
        // Each relay gets its own timeout so one slow relay can't burn the budget
        const per = new AbortController();
        const ptid = setTimeout(() => per.abort(), 6000);
        try {
          const res = await fetch(RELAYS[idx](url), { headers: headers, signal: per.signal, cache: "no-store" });
          if (!res.ok) throw new Error("HTTP " + res.status);
          const text = await res.text();
          if (!text) throw new Error("empty response");
          const json = JSON.parse(text);
          if (json && json.resource_response) {
            if (idx !== workingRelayIndex) {
              workingRelayIndex = idx;   // switch to the relay that just worked
              workingFails = 0;
            } else if (workingFails > 0) {
              workingFails = 0;          // back to healthy
            }
            return json;
          }
          throw new Error("not a pinterest response");
        } catch (e) {
          lastErr = e;
          // After 2 consecutive failures the working relay is probably flaky —
          // rotate so the next request tries the next relay first instead of
          // burning a 6 s timeout every time.
          if (idx === workingRelayIndex && ++workingFails >= 2) {
            workingFails = 0;
            workingRelayIndex = (workingRelayIndex + 1) % RELAYS.length;
          }
        } finally {
          clearTimeout(ptid);
        }
      }
      throw lastErr || new Error("All Pinterest transports failed");
    } finally {
      clearTimeout(otid);
    }
  }

  // scrapers/api_scraper.py: iter_search() + _pump() + _collect()
  async function pinterestSearch(query, num) {
    const bm = new BookmarkManager(1);       // iter_search default bookmarksCount
    const seen = new Set();
    const out = [];

    while (out.length < num) {
      const options = searchOptions(query, bm.get());
      const json = await fetchPinterestJson(buildGet(ENDPOINT_SEARCH, options, options.source_url));
      const parsed = validateResponse(json);
      const results = (parsed.data && parsed.data.results) || [];

      bm.addAll(parsed.bookmarks);
      for (const m of parseResults(results)) {
        if (!seen.has(m.src)) { seen.add(m.src); out.push(m); }
        if (out.length >= num) break;
      }
      if (parsed.bookmarks.includes("-end-")) break;   // no more results
      await new Promise(r => setTimeout(r, 200));      // _pump delay
    }
    return out;
  }

  // ── Query rotation state ──────────────────────────────────────────────────────
  // Each base query gets its own combo cursor. A "combo" = (modifier, page).
  // We build a fixed list of combos per query (modifiers × a few pages) and walk
  // through it. This gives ~14 modifiers × 3 pages = 42 distinct query variants
  // PER base query (378 total) before anything has to repeat — by which point
  // Pinterest's own trending results have likely shifted anyway.
  const MODIFIERS = [
    "", "aesthetic", "cute style", "soft grunge", "kawaii",
    "trend 2025", "outfit inspo", "core aesthetic", "cozy fit",
    "y2k", "pastel", "photo dump", "collage", "vibe"
  ];
  const PAGES_PER_MODIFIER = 3;
  const combos = [];
  for (const mod of MODIFIERS) {
    for (let p = 1; p <= PAGES_PER_MODIFIER; p++) combos.push({ mod, page: p });
  }

  const qstate = QUERIES.map(() => ({ comboIndex: 0 }));
  let qCursor = 0;  // round-robin pointer across base queries
  let fullCycles = 0; // how many times we've wrapped every query through all combos

  const TARGET_ROW_H = () => {
    const h = window.innerHeight;
    if (window.innerWidth < 768) return Math.max(120, Math.min(200, Math.round(h * 0.22)));
    return Math.max(160, Math.min(260, Math.round(h * 0.26)));
  };

  let pool     = [];
  let rendered = 0;
  let seen     = new Set();
  let loading  = false;
  let rowH     = TARGET_ROW_H();
  let lastWidth = window.innerWidth;
  let emptyStreak = 0;

  let statusEl   = document.getElementById("status");
  const galleryEl = document.getElementById("gallery");
  const loaderEl  = document.getElementById("loader");

  let transportDead = false;   // set when every relay failed on a request
  let lastError     = null;    // last transport error message

  function pinId(url) {
    try {
      const m = url.match(/\/([0-9a-f]{16,})\./i) ||
                url.match(/\/([0-9a-f]{8}\/[0-9a-f]{8}\/[0-9a-f]{8}\/[0-9a-f]{8,})/i);
      if (m) return m[1].replace(/\//g, "");
      const parts = url.split("/");
      return parts[parts.length - 1].split("?")[0].split(".")[0];
    } catch { return url; }
  }

  BLACKLIST.forEach(u => seen.add(pinId(u)));

  // ── Smart per-query fetch ────────────────────────────────────────────────────
  // Walks this query's combo list (modifier + page). Each combo is a genuinely
  // different search string sent to Pinterest, so results differ. Tries up to
  // MAX_ATTEMPTS_PER_QUERY combos in a row if earlier ones come back all-duplicate.
  async function fetchFromQuery(qi, needed) {
    const base = QUERIES[qi];
    const st   = qstate[qi];
    const fresh = [];

    for (let attempt = 0; attempt < MAX_ATTEMPTS_PER_QUERY && fresh.length < needed; attempt++) {
      const combo = combos[st.comboIndex % combos.length];
      const q = combo.mod ? `${base} ${combo.mod}` : base;

      st.comboIndex++;
      if (st.comboIndex % combos.length === 0) fullCycles++;

      try {
        const medias = await pinterestSearch(q, needed);
        transportDead = false;
        let addedThisAttempt = 0;
        for (const m of medias) {
          if (!/i\.pinimg\.com/i.test(m.src)) continue;
          if (BLACKLIST.has(m.src)) continue;
          const id = pinId(m.src);
          if (seen.has(id)) continue;
          seen.add(id);
          fresh.push(m.src);
          addedThisAttempt++;
          if (fresh.length >= needed) break;
        }
        if (addedThisAttempt > 0) {
          break;
        }
      } catch (e) {
        if (e.name === "AbortError" || /transports failed/i.test(e.message)) {
          transportDead = true;
          lastError = e.message;
        }
        console.warn("query failed", q, e.name === "AbortError" ? "(timeout)" : e);
      }
    }

    return fresh;
  }

  // ── Batch fetcher: round-robin across base queries, with limited parallelism ──
  // cors.sh round-trips ~1 s; fetching queries one at a time makes each batch
  // slow. Fetch up to BATCH_CONCURRENCY queries concurrently (Pinterest allows
  // parallel requests; the relay handles the queueing).
  const BATCH_CONCURRENCY = 3;

  async function fetchBatch() {
    const fresh = [];
    const queue = [];
    for (let i = 0; i < QUERIES.length; i++) {
      queue.push((qCursor + i) % QUERIES.length);
      if (queue.length >= BATCH_CONCURRENCY || fresh.length >= BATCH_SIZE) break;
    }
    qCursor = (qCursor + queue.length) % QUERIES.length;

    const slots = [];
    const pull = async (qi) => {
      const needed = BATCH_SIZE - fresh.length;
      if (needed <= 0) return;
      const got = await fetchFromQuery(qi, needed);
      fresh.push(...got);
    };
    for (let i = 0; i < Math.min(queue.length, BATCH_CONCURRENCY); i++) {
      slots.push(pull(queue[i]));
    }
    await Promise.all(slots);
    return fresh;
  }

  function loadImage(src) {
    return new Promise(resolve => {
      const img = new Image();
      img.onload = () => {
        if (img.naturalWidth < 80 || img.naturalHeight < 80) { resolve(null); return; }
        resolve({ src, w: img.naturalWidth, h: img.naturalHeight });
      };
      img.onerror = () => resolve(null);
      img.src = src;
    });
  }

  async function loadAndAdd(urls) {
    if (!urls.length) return 0;
    const results = await Promise.all(urls.map(loadImage));
    let added = 0;
    for (const r of results) {
      if (!r) continue;
      if (BLACKLIST.has(r.src)) continue;
      const id = pinId(r.src);
      if (pool.some(p => p.id === id)) continue;
      pool.push({ src: r.src, aspect: r.w / r.h, id });
      added++;
    }
    return added;
  }

  function appendRows(fromIndex, maxImages) {
    const available = pool.slice(fromIndex, fromIndex + maxImages);
    if (!available.length) return 0;
    const containerWidth = galleryEl.clientWidth || window.innerWidth;
    if (containerWidth <= 0) return 0;

    const rows = [];
    let cur = [], sumAspect = 0, used = 0;
    for (const item of available) {
      cur.push(item); sumAspect += item.aspect; used++;
      if (sumAspect * rowH >= containerWidth * 0.98) {
        rows.push({ items: cur, aspectSum: sumAspect });
        cur = []; sumAspect = 0;
      }
    }

    rows.forEach(row => {
      const rh    = containerWidth / row.aspectSum;
      const rowEl = document.createElement("div");
      rowEl.className   = "row new";
      rowEl.style.height = Math.floor(rh) + "px";

      row.items.forEach(item => {
        const link       = document.createElement("a");
        link.href        = item.src;
        link.target      = "_blank";
        link.rel         = "noopener";
        link.style.width  = Math.floor(item.aspect * rh) + "px";
        link.style.height = Math.floor(rh) + "px";
        const img        = document.createElement("img");
        img.src          = item.src;
        img.alt          = "pawsocks";
        img.loading      = "lazy";
        img.decoding     = "async";
        link.appendChild(img);
        rowEl.appendChild(link);
      });

      // Pixel-perfect fill: absorb rounding error into the last cell
      const links = rowEl.querySelectorAll("a");
      if (links.length) {
        let total = 0;
        links.forEach(a => total += parseInt(a.style.width, 10));
        const diff = containerWidth - total;
        if (diff !== 0) {
          const last = links[links.length - 1];
          last.style.width = (parseInt(last.style.width, 10) + diff) + "px";
        }
      }
      galleryEl.appendChild(rowEl);
    });

    return used - cur.length;
  }

  function revealAvailable() {
    if (rendered >= pool.length) return 0;
    const added = appendRows(rendered, pool.length - rendered);
    rendered += added;
    return added;
  }

  // ── Main cycle ───────────────────────────────────────────────────────────────
  async function cycle() {
    if (loading) return false;
    loading = true;
    loaderEl.classList.add("visible");
    loaderEl.textContent = "loading more…";
    let gotNew = false;
    try {
      const urls = await fetchBatch();
      if (urls.length) {
        await loadAndAdd(urls);
        revealAvailable();
        emptyStreak = 0;
        gotNew = true;
      } else {
        emptyStreak++;
        if (emptyStreak === 3) {
          console.info(`No new images across all ${combos.length * QUERIES.length} query combos (wrap #${fullCycles}). Backing off — will keep retrying as new pins get indexed.`);
        }
      }
    } finally {
      loading = false;
      loaderEl.classList.remove("visible");
    }
    return gotNew;
  }

  function fullRelayout() {
    const scrollRatio = document.documentElement.scrollHeight > 0
      ? window.pageYOffset / document.documentElement.scrollHeight : 0;
    rowH = TARGET_ROW_H();
    galleryEl.innerHTML = "";
    const prev = rendered; rendered = 0;
    while (rendered < prev) { const n = appendRows(rendered, 30); if (!n) break; rendered += n; }
    requestAnimationFrame(() => window.scrollTo(0, scrollRatio * document.documentElement.scrollHeight));
  }

  window.addEventListener("resize", () => {
    if (window.innerWidth === lastWidth) return;
    lastWidth = window.innerWidth;
    clearTimeout(window.__rt);
    window.__rt = setTimeout(fullRelayout, 150);
  });
  window.addEventListener("orientationchange", () => {
    lastWidth = window.innerWidth;
    clearTimeout(window.__rt);
    window.__rt = setTimeout(fullRelayout, 250);
  });

  let scrollLocked = false;
  function onScroll() {
    if (scrollLocked) return;
    const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
    const docH      = document.documentElement.scrollHeight;
    if (docH - scrollTop - window.innerHeight < 900) {
      scrollLocked = true;
      currentDelay = FETCH_INTERVAL;
      cycle().finally(() => setTimeout(() => { scrollLocked = false; }, 400));
    }
  }

  // ── Adaptive polling ─────────────────────────────────────────────────────────
  let currentDelay = FETCH_INTERVAL;
  const MAX_DELAY  = 30000;
  let pollTimer = null;

  function scheduleNext() {
    clearTimeout(pollTimer);
    pollTimer = setTimeout(async () => {
      const gotNew = await cycle();
      currentDelay = gotNew ? FETCH_INTERVAL : Math.min(MAX_DELAY, Math.round(currentDelay * 1.7));
      loaderEl.textContent = gotNew ? "loading more…" : "no new pics right now — retrying…";
      scheduleNext();
    }, currentDelay);
  }

  async function init() {
    statusEl.textContent = "loading";
    rowH = TARGET_ROW_H(); lastWidth = window.innerWidth;
    // Remove the full-screen status overlay as soon as the first images render,
    // then keep filling a few more batches in the background.
    for (let i = 0; i < 3; i++) {
      await cycle();
      if (galleryEl.children.length) {
        statusEl.remove();
        statusEl = null;
        break;
      }
      if (transportDead) break;  // relays down, don't burn 3 cycles
    }
    if (transportDead && !galleryEl.children.length) {
      statusEl.textContent =
        "Can't reach Pinterest through any relay right now (" + (lastError || "network error") +
        "). Every relay is rate-limited or offline — the page will keep retrying.";
      statusEl.style.color = "#d44";
      scheduleNext();
      window.addEventListener("scroll", onScroll, { passive: true });
      return;
    }
    if (statusEl) statusEl.remove();
    scheduleNext();
    window.addEventListener("scroll", onScroll, { passive: true });
  }

  init();
})();
</script>
</body>
</html>
